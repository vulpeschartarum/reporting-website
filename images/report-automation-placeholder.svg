<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Report automation engine placeholder</title>
  <desc id="desc">A simple placeholder workflow graphic for SQL files, exports, and logging.</desc>
  <rect width="1200" height="750" fill="#f7f8fa"/>
  <rect x="70" y="70" width="1060" height="610" rx="10" fill="#ffffff" stroke="#dce3ea"/>
  <text x="110" y="135" fill="#18212b" font-family="Arial, sans-serif" font-size="34" font-weight="700">Report Automation Engine</text>
  <text x="110" y="176" fill="#5b6773" font-family="Arial, sans-serif" font-size="20">Placeholder screenshot - replace with your tool screenshot</text>
  <rect x="120" y="260" width="230" height="150" rx="8" fill="#eef3f6" stroke="#dce3ea"/>
  <text x="160" y="330" fill="#18212b" font-family="Arial, sans-serif" font-size="26" font-weight="700">SQL Files</text>
  <text x="160" y="365" fill="#5b6773" font-family="Arial, sans-serif" font-size="18">queries/*.sql</text>
  <path d="M370 335 L470 335" stroke="#1f6f8b" stroke-width="8" stroke-linecap="round"/>
  <path d="M450 315 L475 335 L450 355" fill="none" stroke="#1f6f8b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="500" y="240" width="250" height="190" rx="8" fill="#ffffff" stroke="#dce3ea"/>
  <text x="545" y="315" fill="#18212b" font-family="Arial, sans-serif" font-size="26" font-weight="700">Run Engine</text>
  <text x="545" y="350" fill="#5b6773" font-family="Arial, sans-serif" font-size="18">execute query</text>
  <text x="545" y="382" fill="#5b6773" font-family="Arial, sans-serif" font-size="18">validate output</text>
  <path d="M775 335 L875 335" stroke="#1f6f8b" stroke-width="8" stroke-linecap="round"/>
  <path d="M855 315 L880 335 L855 355" fill="none" stroke="#1f6f8b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="905" y="260" width="175" height="150" rx="8" fill="#eef3f6" stroke="#dce3ea"/>
  <text x="940" y="320" fill="#18212b" font-family="Arial, sans-serif" font-size="24" font-weight="700">Exports</text>
  <text x="940" y="355" fill="#5b6773" font-family="Arial, sans-serif" font-size="18">CSV / Excel</text>
  <rect x="270" y="485" width="660" height="105" rx="8" fill="#ffffff" stroke="#dce3ea"/>
  <text x="310" y="545" fill="#18212b" font-family="Arial, sans-serif" font-size="24" font-weight="700">Logging</text>
  <text x="435" y="545" fill="#5b6773" font-family="Arial, sans-serif" font-size="18">success, failure, row counts, timestamps</text>
</svg>
